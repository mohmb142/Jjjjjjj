<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Pocket OTC AI chart image analyzer">
  <title>Pocket OTC AI Analyzer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>📊 Pocket OTC AI Analyzer</h1>
    <div class="safe">🔒 تحليل بصري فقط — لا يتم تنفيذ أو فتح أو إغلاق أي صفقة.</div>

    <label for="image">صورة الشارت</label>
    <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
    <small>الحد الأقصى 12MB. استخدم صورة واضحة تحتوي على الشموع والمؤشرات الظاهرة.</small>

    <label for="key">OpenRouter API Key <span>(اختياري إذا كان مضبوطًا على الخادم)</span></label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-...">
    <small>يُرسل المفتاح في Header ولا يوضع في عنوان URL.</small>

    <button id="go" type="button">🔎 تحليل الصورة</button>
    <pre id="out" aria-live="polite">اختر صورة شارت واضحة ثم اضغط تحليل.</pre>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
