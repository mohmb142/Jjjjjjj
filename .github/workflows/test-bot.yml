name: Test Pocket OTC AI Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q main.py image_analyzer.py indicators.py openrouter.py pocket_data.py signal_engine.py telegram_bot.py

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test FastAPI
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          client = TestClient(app)
          assert client.get('/health').status_code == 200
          assert client.get('/api/pairs').status_code == 200
          print('FastAPI smoke test OK')
          PY

      - name: Test real OTC data endpoint
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio
          from pocket_data import get_closed_candles, PocketDataError

          async def main():
              try:
                  candles = await get_closed_candles('EURUSD_otc')
                  print('OTC API returned', len(candles), 'candles')
              except PocketDataError as exc:
                  print('OTC API unavailable (non-blocking):', exc)

          asyncio.run(main())
          PY
